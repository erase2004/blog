# Every week, checks every old WordPress URL on the production site over HTTP,
# with the www redirect and HSTS that only the production domain has
# (ticket 21: four weeks of monitoring after the cutover, and after that as a
# standing check). A failed run is mailed to whoever last changed the
# schedule below. Nothing is deployed and no secrets are used.
#
# GitHub runs schedules only from the default branch, and pauses them after
# 60 days without activity in a public repo.
name: Production check

on:
  schedule:
    # Sundays at 01:17 UTC (09:17 in Taipei), off the top of the hour, when
    # GitHub's scheduler is busiest.
    - cron: '17 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check aniya.moe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check every old URL on https://aniya.moe
        run: npm run check-urls -- http https://aniya.moe
