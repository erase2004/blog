# Every push builds the site and checks every old WordPress URL against the
# build output, and runs the tests alongside. When both pass, it deploys the
# checked build: main to the production Worker (`wrangler deploy`), any other
# branch as a preview version (`wrangler versions upload`), and checks every
# old URL again over HTTP on the URL it was deployed to. Alongside, the
# Conventions job checks the commit messages and the branch name.
#
# Pushes only, never `pull_request`: the repo is public, and the Cloudflare
# secrets must never reach code from a fork.
name: CI/CD

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. A new push to a branch cancels the run in
# progress for its preview; on main the newest push waits instead, so a
# production deploy is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Astro keeps the webp images it makes in node_modules/.astro/assets
      # (minutes of work without them), each file named after its source
      # image's content and its transform. So any earlier cache gives the same
      # bytes, as long as sharp (package-lock.json) and the image settings
      # (astro.config.mjs) are the same: those make the prefix. After npm ci,
      # which empties node_modules.
      - name: Restore the optimized images
        id: restore-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
          restore-keys: astro-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
      - run: npm run build
      # A new cache only when the build made images the restored one did not
      # have: the key ends with a hash of the cached file names.
      - name: Name the optimized images
        id: images
        env:
          PREFIX: ${{ steps.restore-images.outputs.cache-primary-key }}
        run: |
          names=$(find node_modules/.astro/assets -type f -printf '%f\n' | LC_ALL=C sort | sha256sum | cut -c1-16)
          echo "key=$PREFIX$names" >> "$GITHUB_OUTPUT"
      - name: Save the optimized images
        if: steps.images.outputs.key != steps.restore-images.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/assets
          key: ${{ steps.images.outputs.key }}
      - name: Check every old URL against the build output
        run: npm run check-urls -- build
      # The deploy job publishes exactly these files, the ones just checked.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # Builds a copy of its own (with test-only pages) and serves it with
  # `wrangler dev`: tests/site/global-setup.ts.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Type-checks the .astro files, src/, scripts/ and tests/: neither the
      # build nor Vitest does.
      - run: npm run check
      # The build job's cache (see there); the test-only pages' few images are
      # not worth saving.
      - name: Restore the optimized images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
          restore-keys: astro-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Commit messages follow Conventional Commits (commitlint.config.mjs) and
  # the branch name Conventional Branch (scripts/branch-name.ts), as the local
  # hooks check (.husky/). Not a condition of the deploy: the protect-main
  # ruleset requires it before a merge instead.
  conventions:
    name: Conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and origin/main, to find the pushed commits.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the branch name
        run: node scripts/branch-name.ts "$GITHUB_REF_NAME"
      - run: npm ci
      # A branch: its commits that main does not have. main: the commits the
      # push added. A new main (an all-zero `before`) or a manual run (none):
      # the commit main points at.
      - name: Check the commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            from=origin/main
          elif [ -n "${BEFORE//0/}" ]; then
            from=$BEFORE
          else
            from=
          fi
          if [ -z "$from" ]; then
            npx --no -- commitlint --last --verbose
          elif [ "$(git rev-list --count "$from..$GITHUB_SHA")" = 0 ]; then
            echo "No commits to check: $GITHUB_SHA has none that $from does not."
          else
            npx --no -- commitlint --from "$from" --to "$GITHUB_SHA" --verbose
          fi

  deploy:
    name: Deploy
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deployed.outputs.url }}
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # wrangler (the repo's own) and the URL checker.
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # wrangler writes what it did to WRANGLER_OUTPUT_FILE_PATH, one JSON
      # record per line: {"type":"deploy","targets":[<URLs>],…} or
      # {"type":"version-upload","preview_url":…,"preview_alias_url":…,…}.
      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: npx wrangler deploy --message "$GITHUB_SHA"
      # Fails while the Worker has never been deployed: wrangler uploads
      # versions only of a Worker that exists.
      - name: Upload a preview version
        if: github.ref != 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          alias=$(node scripts/preview-alias.ts "$GITHUB_REF_NAME")
          npx wrangler versions upload --preview-alias "$alias" --message "$GITHUB_SHA"
      - name: Find the deployed URL
        id: deployed
        env:
          OUTPUT: ${{ runner.temp }}/wrangler-output.json
          PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$PRODUCTION" = true ]; then
            url=$(jq -r 'select(.type == "deploy") | .targets // [] | .[] | select(startswith("https://") and endswith(".workers.dev"))' "$OUTPUT" | head -n 1)
            version=$(jq -r 'select(.type == "deploy") | .version_id // empty' "$OUTPUT")
            alias_url=
          else
            url=$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$OUTPUT")
            version=$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$OUTPUT")
            alias_url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$OUTPUT")
          fi
          if [ -z "$url" ]; then
            echo "::error::wrangler gave no workers.dev URL. Preview URLs need \"preview_urls\": true in wrangler.jsonc, which only wrangler deploy applies."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            if [ "$PRODUCTION" = true ]; then
              echo "### Deployed to production"
              echo
              echo "- $url"
            else
              echo "### Preview"
              echo
              echo "- This version: $url"
              if [ -n "$alias_url" ]; then echo "- Branch \`$GITHUB_REF_NAME\` (its latest version): $alias_url"; fi
            fi
            echo "- Worker version: \`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # A new version's URL may take a moment to answer.
      - name: Wait for the deployed site
        env:
          URL: ${{ steps.deployed.outputs.url }}
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$URL/") || status=000
            if [ "$status" = 200 ]; then exit 0; fi
            echo "attempt $attempt: $URL/ answered $status"
            sleep 5
          done
          echo "::error::$URL/ did not answer 200 within 5 minutes"
          exit 1
      - name: Check every old URL on the deployed site
        env:
          URL: ${{ steps.deployed.outputs.url }}
        run: npm run check-urls -- http "$URL"
